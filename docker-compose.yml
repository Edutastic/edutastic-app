
services:
  db:
    image: postgres:16
    container_name: edutastic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: edutastic_dev_password
      POSTGRES_DB: edutastic
    ports:
      - "5433:5432"
    volumes:
      - edutastic_postgres_data:/var/lib/postgresql/data

volumes:
  edutastic_postgres_data:
