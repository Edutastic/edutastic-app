
services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: edutastic
      POSTGRES_PASSWORD: edutastic_dev_password
      POSTGRES_DB: edutastic

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - edutastic_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edutastic -d edutastic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edutastic_data:
